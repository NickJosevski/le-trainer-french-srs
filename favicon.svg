<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Le Trainer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- app-tile background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- back card of the stack -->
  <rect x="16" y="15" width="34" height="26" rx="5" transform="rotate(-9 33 28)"
        fill="#ffffff" opacity="0.38"/>
  <!-- front flashcard -->
  <rect x="15" y="20" width="34" height="26" rx="5" fill="#ffffff"/>
  <!-- lines of text on the card -->
  <rect x="20" y="27" width="20" height="3.4" rx="1.7" fill="#6366f1"/>
  <rect x="20" y="33" width="24" height="3.4" rx="1.7" fill="#22d3ee"/>
  <rect x="20" y="39" width="14" height="3.4" rx="1.7" fill="#94a3b8"/>
</svg>
